version: '3.8'
services:
  railway-simulator:
    build: .
    container_name: indian_railway_sim
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend-engine

  backend-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indian_railway_backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

